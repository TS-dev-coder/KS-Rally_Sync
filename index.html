<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RallySync — Kingshot rally timing</title>
<meta name="description" content="Offline rally timing for Kingshot Castle Battle. Works out each rally lead's launch time so every march lands on the same second.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RallySync">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b16'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2335e6ff' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2335e6ff'/%3E%3Cpath d='M32 4v9M32 51v9M4 32h9M51 32h9' stroke='%2335e6ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Rally<span>Sync</span></span>
      <span class="brand-tag">Kingshot</span>
    </div>
    <div class="clock">
      <span class="clock-utc" id="clock-utc">--:--:--</span>
      <span class="clock-sub">
        <span id="clock-local">--:--:--</span>
        <span class="clock-offset" id="clock-offset"></span>
      </span>
    </div>
  </header>

  <main id="main"></main>

  <noscript>
    <div class="banner banner-error">
      RallySync needs JavaScript. Everything runs in your browser — nothing is sent anywhere.
    </div>
  </noscript>

</div>

<nav class="nav" id="nav" aria-label="Sections"></nav>

<script src="js/dom.js"></script>
<script src="js/icons.js"></script>
<script src="js/zones.js"></script>
<script src="js/calculations.js"></script>
<script src="js/roster-import.js"></script>
<script src="js/share.js"></script>
<script src="js/alarm.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/guide.js"></script>
<script src="js/timepicker.js"></script>
<script src="js/focus.js"></script>
<script src="js/dragorder.js"></script>
<script src="js/views/roster.js"></script>
<script src="js/views/targets.js"></script>
<script src="js/views/calculate.js"></script>
<script src="js/views/calibrate.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>

</body>
</html>
