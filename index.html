<!-- Outside .app so the bar itself spans the viewport while its contents stay
     aligned with the content column. Sticky inside a max-width container, its
     background stopped at the column edge and page content scrolled past the
     unpainted gutters beside it. -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">Rally<span>Sync</span></span>
      <span class="brand-tag">Kingshot</span>
      <span class="brand-version" id="brand-version"></span>
    </div>
    <div class="clock">
      <span class="clock-utc" id="clock-utc">--:--:--</span>
      <span class="clock-sub">
        <span id="clock-local">--:--:--</span>
        <span class="clock-offset" id="clock-offset"></span>
      </span>
    </div>
  </div>
</header>

<div class="app">

  <main id="main"></main>

  <noscript>
    <div class="banner banner-error">
      RallySync needs JavaScript. Everything runs in your browser — nothing is sent anywhere.
    </div>
  </noscript>

</div>
